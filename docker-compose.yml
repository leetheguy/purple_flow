services:
  app:
    build: .
    container_name: purple_flow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=${PORT:-4000}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE is required, generate one with `openssl rand -base64 48`}
      - DATABASE_URL=${DATABASE_URL:-ecto://purple_flow:purple_flow@db/purple_flow}
      - PURPLEFLOW_SECRET_KEY=${PURPLEFLOW_SECRET_KEY:?PURPLEFLOW_SECRET_KEY is required, generate one with `openssl rand -base64 32`}
      - PURPLEFLOW_ADMIN_USERNAME=${PURPLEFLOW_ADMIN_USERNAME:?PURPLEFLOW_ADMIN_USERNAME is required}
      - PURPLEFLOW_ADMIN_PASSWORD=${PURPLEFLOW_ADMIN_PASSWORD:?PURPLEFLOW_ADMIN_PASSWORD is required}
      # Code node scripts run in the runner, below. The app refuses every web
      # request from the runner's network.
      - PURPLEFLOW_RUNNER_ADDRESS=runner:4100
      - PURPLEFLOW_RUNNER_SUBNET=${PURPLEFLOW_RUNNER_SUBNET:-10.250.250.0/24}
      # No Erlang distribution. The app and the runner are the same release
      # with the same cookie, so a script could otherwise connect straight
      # into the app's VM.
      - RELEASE_DISTRIBUTION=none
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./workflows:/app/workflows
    networks:
      - purple_flow
      - runner
    # Remove this block if you're pointing DATABASE_URL at an external
    # Postgres instead of the bundled "db" service — see README "Database".
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-4000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs every Code node script. Same image as the app, started as the
  # runner: no secrets, no database, no internet, and no route to anything
  # but answering the app. See specs/070_code_sandbox.md.
  runner:
    build: .
    container_name: purple_flow-runner
    command: ["/app/bin/runner"]
    restart: unless-stopped
    # Deliberately no env_file, and nothing secret here.
    environment:
      - PURPLEFLOW_RUNNER_PORT=4100
      - RELEASE_DISTRIBUTION=none
      # The release writes its runtime config at boot; the rest is read-only.
      - RELEASE_TMP=/tmp
    networks:
      - runner
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  # Bundled Postgres, for a self-contained install. If you're connecting to
  # an existing Postgres instead, delete this service and the app's
  # `depends_on: db` block, then point DATABASE_URL at your own database
  # (see README "Database").
  db:
    image: postgres:17
    container_name: purple_flow-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=purple_flow
      - POSTGRES_PASSWORD=purple_flow
      - POSTGRES_DB=purple_flow
    volumes:
      - purple_flow_db_data:/var/lib/postgresql/data
    networks:
      - purple_flow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple_flow"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  purple_flow:
  # Only the app and the runner. `internal`: no route to the internet.
  runner:
    internal: true
    ipam:
      config:
        - subnet: ${PURPLEFLOW_RUNNER_SUBNET:-10.250.250.0/24}

volumes:
  purple_flow_db_data:
