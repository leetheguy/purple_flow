# A crash test: 100 diamonds in a row. Each one splits into a branch that
# always fails and one that counts, then merges them again. A failure stops
# only its own item, so the counting branch carries on and the run ends
# `complete` with {"survived": 100}; the run's page shows 100 failed items.
#   curl -X POST localhost:4000/hooks/diamonds -H 'content-type: application/json' -d '{}'
# Generated; see the comment in start.exs.

[workflow]
name = "diamonds"

[trigger.webhook]
path = "diamonds"

[[steps]]
name = "start"
node = "start.toml"

[[steps]]
name = "fail_1"
node = "fail.toml"
after = ["start"]

[[steps]]
name = "ok_1"
node = "ok.toml"
after = ["start"]

[[steps]]
name = "merge_1"
