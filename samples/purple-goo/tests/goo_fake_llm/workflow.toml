# A fake OpenAI chat provider for the Purple Goo tests. It answers with one
# streamed message whose content is JSON describing the request it got:
# {"model", "has_metadata", "messages": [[role, content], ...]}.
# Model "boom" makes it fail, so the tests can check errors.
#   base URL: /hooks/goo-fake-llm   (POST /hooks/goo-fake-llm/chat/completions)

[workflow]
name = "goo_fake_llm"

[trigger.webhook]
path = "goo-fake-llm/chat/completions"

[[steps]]
name = "echo"
node = "echo.toml"
on_fail = "end_run"

[[steps]]
name = "reply"
node = "reply.toml"
after = ["echo"]
