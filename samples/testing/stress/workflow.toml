# A stress test: one run, many Code executions at once.
# Try it: POST how many and how long each one sleeps (defaults: 10000, 1000 ms):
#   curl -X POST localhost:4000/hooks/stress -H 'content-type: application/json' \
#     -d '{"count": 10000, "sleep_ms": 1000}'
# The reply comes right away with the run ID; watch the run on its page.
# Every execution is saved, so a 10,000-item run adds about 30,000 step_runs rows.

[workflow]
name = "stress"

[trigger.webhook]
path = "stress"
respond = "immediately"

[[steps]]
name = "fan_out"
node = "fan_out.toml"

# All of them at once: concurrency is the most running at a time (default 1000).
[[steps]]
name = "work"
node = "work.toml"
after = ["fan_out"]
concurrency = 10000

[[steps]]
name = "gather"
node = "gather.toml"
after = ["work"]

[[steps]]
name = "summary"
node = "summary.toml"
after = ["gather"]
